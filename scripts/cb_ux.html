<!-- CB-UX: shared 3-card behaviour (auto-calculate, result flash, jump link). Injected by scripts/apply_cb_ux.py -->
<style id="cb-ux-style">
.cb-flash{animation:cbFlash .95s ease}
.cb-flash.cb-area{border-radius:16px}
@keyframes cbFlash{
  0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}
  45%{box-shadow:0 0 0 10px rgba(22,163,74,.18)}
  100%{box-shadow:0 0 0 20px rgba(22,163,74,0)}
}
.cb-jump{display:block;margin:14px 0 0;padding:11px 12px;background:var(--surface-sunken);border:1px solid var(--border-fine);border-radius:8px;font-size:12.5px;font-weight:600;color:#1E3A5F;text-decoration:none;text-align:center}
.cb-jump:hover{background:var(--gold-tint);border-color:#BADEC6}
.cb-scroll-target{scroll-margin-top:88px}
@media(prefers-reduced-motion:reduce){.cb-flash{animation:none}}
</style>
<script>
/* CB-UX — one shared implementation for every 3-card calculator page.
   Wrapped in try/catch so it can never break the page it is added to. */
(function(){
  "use strict";
  var BAR_TEXT = 'Just enter your values below \u2014 results update automatically.';

  function init(){
    try{
      var grid = null, all = document.querySelectorAll('div');
      for (var i=0;i<all.length;i++){
        var ta = getComputedStyle(all[i]).gridTemplateAreas || '';
        /* the mobile media query re-orders these areas, so match on the tokens, not the order */
        if (/\bform\b/.test(ta) && /\b(result|rightstack)\b/.test(ta) && /\bsidebar\b/.test(ta)){ grid = all[i]; break; }
      }
      if (!grid) return;

      /* --- locate the pieces by the grid area they occupy --- */
      function areaChild(name){
        var kids = grid.children;
        for (var i=0;i<kids.length;i++){
          if ((getComputedStyle(kids[i]).gridArea||'').split('/')[0].trim() === name) return kids[i];
        }
        return null;
      }
      var barArea    = areaChild('bar');
      var formArea   = areaChild('form');
      var resultArea = areaChild('result') || areaChild('rightstack');
      var bottomArea = areaChild('bottomgrid');

      /* --- 1. status bar: same sentence on every calculator --- */
      if (barArea){
        var bar = barArea.matches('[class*="-bar"]') ? barArea : barArea.querySelector('[class*="-bar"]');
        if (bar){
          var span = bar.querySelector('span');
          if (span){
            var badge = span.querySelector('span');   /* some pages prefix a small badge */
            if (badge){
              /* keep the badge, replace only the sentence after it */
              while (badge.nextSibling) span.removeChild(badge.nextSibling);
              span.appendChild(document.createTextNode(BAR_TEXT));
            } else if (!span.querySelector('*')) {
              span.textContent = BAR_TEXT;
            }
          }
        }
      }

      /* --- 2. the calculate button --- */
      var btns = [], seen = [];
      function addBtn(b){ if (b && seen.indexOf(b) < 0){ seen.push(b); btns.push(b); b.setAttribute('data-cb-calc','1'); } }
      var scope = formArea || grid;
      Array.prototype.forEach.call(scope.querySelectorAll('[id*="calcBtn"], [id*="-calc"]'), function(b){
        if (b.tagName === 'BUTTON') addBtn(b);
      });
      Array.prototype.forEach.call(scope.querySelectorAll('button'), function(b){
        if (/^\s*calculate\s*$/i.test(b.textContent)) addBtn(b);
      });
      var btn = btns[0] || null;

      /* --- 3. the card that shows the answer --- */
      var card = null;
      if (resultArea){
        /* Prefer a real result CARD. Some pages hang the coloured head straight off
           the result area with no card wrapper, and matching '-result' there grabs
           the 95px header, so the ring only appeared under the green strip. Falling
           back to the whole area puts the ring around everything instead. */
        card = resultArea.querySelector('[class*="-result-card"]');
        if (!card){
          var kids = resultArea.children, only = null, n = 0;
          for (var c = 0; c < kids.length; c++){
            if (/-card\b/.test(kids[c].className || '')){ only = kids[c]; n++; }
          }
          card = (n === 1) ? only : resultArea;
        }
        if (card === resultArea) card.classList.add('cb-area');
        card.classList.add('cb-scroll-target');
        card.setAttribute('data-cb-result','1');
      }

      function flash(){
        if (!card) return;
        card.classList.remove('cb-flash');
        void card.offsetWidth;
        card.classList.add('cb-flash');
        setTimeout(function(){ card.classList.remove('cb-flash'); }, 1000);
      }

      /* --- 4. auto-calculate as the visitor types --- */
      var auto = false, timer = null;
      function runCalc(){
        auto = true;
        try {
          var target = null;
          for (var k=0;k<btns.length;k++){ if (btns[k].offsetParent !== null){ target = btns[k]; break; } }
          (target || btns[0]).click();
          window.__cbAutoRuns = (window.__cbAutoRuns || 0) + 1;
        } finally { auto = false; }
      }
      if (btns.length && scope){
        scope.addEventListener('input', function(){
          clearTimeout(timer);
          timer = setTimeout(runCalc, 180);
        });
        scope.addEventListener('change', function(e){
          var t = e.target;
          if (t && (t.tagName === 'SELECT' || /radio|checkbox/i.test(t.type || ''))) runCalc();
        });

        /* --- 5. pressing Calculate confirms itself --- */
        btns.forEach(function(b){
          b.addEventListener('click', function(){
            if (auto) return;
            if (!card){ return; }
            /* Always bring the answer to the visitor. On a long form they have
               scrolled well past the result card, so flashing alone is invisible
               and reads as "nothing happened" - scroll first, then flash. */
            var r = card.getBoundingClientRect();
            var settled = r.top >= 60 && r.top <= (window.innerHeight * 0.5);
            if (settled){
              flash();
            } else {
              card.scrollIntoView({behavior:'smooth', block:'start'});
              setTimeout(flash, 420);
            }
          });
        });
      }

      /* --- 6. link down to the detail section --- */
      if (card && bottomArea && !document.querySelector('.cb-jump')){
        var target = bottomArea.querySelector('[class*="-card"]') || bottomArea;
        if (!target.id) target.id = 'cb-detail';
        target.classList.add('cb-scroll-target');
        var a = document.createElement('a');
        a.className = 'cb-jump';
        a.href = '#' + target.id;
        a.innerHTML = 'See the full breakdown \u2193';
        (resultArea || card.parentNode).appendChild(a);
      }
    }catch(e){ /* never break the page */ }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(init,120); });
  else setTimeout(init,120);
})();
</script>
